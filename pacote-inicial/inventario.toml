nome = "rt-andar1"
funcao = "Roteador do primeiro andar"
responsavel = "equipe de redes"
interfaces = [
  { nome = "eth0",  rede = "enlace-andar1", endereco = "10.80.11.2/24" },
  { nome = "eth1",  rede = "alfa",          endereco = "10.80.21.1/24" },
  { nome = "eth2",  rede = "beta",          endereco = "10.80.22.1/24" },
  { nome = "mgmt0", rede = "gerencia",      endereco = "10.80.250.2/24" },
]
software = [
  { nome = "nftables",     versao = "1.1.3",      porta = "" },
  { nome = "exportar-nft", versao = "pacote-inicial", porta = "9102/tcp (mgmt0)" },
  { nome = "snmpd",        versao = "5.9.4.pre2", porta = "161/udp (mgmt0)" },
  { nome = "tc netem",     versao = "iproute2 6.15.0", porta = "" },
]

[[maquina]]
nome = "rt-andar2"
funcao = "Roteador do segundo andar"
responsavel = "equipe de redes"
interfaces = [
  { nome = "eth0",  rede = "enlace-andar2", endereco = "10.80.12.2/24" },
  { nome = "eth1",  rede = "gama",          endereco = "10.80.23.1/24" },
  { nome = "mgmt0", rede = "gerencia",      endereco = "10.80.250.3/24" },
