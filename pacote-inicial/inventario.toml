# Inventário da rede do Espaço Ponto Comum
# Uma seção [[maquina]] por contêiner. O script de inventário compara este arquivo
# com a rede em funcionamento e lista cada diferença.
#
# Campos:
#   nome         nome da máquina (igual ao container_name do compose.yaml)
#   funcao       o que a máquina faz
#   responsavel  "equipe de redes" (roteadores) ou "equipe de sistemas" (demais)
#   interfaces   uma por rede: nome da interface, rede Docker e endereço/prefixo
#   software     programas em execução e versão (preenchido a cada degrau)

# ---------------------------------------------------------------- roteadores

[[maquina]]
nome = "rt-borda"
funcao = "Roteador de borda"
responsavel = "equipe de redes"
interfaces = [
  { nome = "eth0",  rede = "internet",      endereco = "10.80.0.1/24" },
  { nome = "eth1",  rede = "comum",         endereco = "10.80.1.1/24" },
  { nome = "eth2",  rede = "enlace-andar1", endereco = "10.80.11.1/24" },
  { nome = "eth3",  rede = "enlace-andar2", endereco = "10.80.12.1/24" },
  { nome = "mgmt0", rede = "gerencia",      endereco = "10.80.250.1/24" },
]
software = [
  { nome = "nftables",     versao = "1.1.3",      porta = "" },
  { nome = "exportar-nft", versao = "pacote-inicial", porta = "9102/tcp (mgmt0)" },
  { nome = "snmpd",        versao = "5.9.4.pre2", porta = "161/udp (mgmt0)" },
  { nome = "tc netem",     versao = "iproute2 6.15.0", porta = "" },
]

