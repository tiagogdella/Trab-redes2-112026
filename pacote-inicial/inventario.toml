  { nome = "nftables",     versao = "1.1.3",      porta = "" },
  { nome = "exportar-nft", versao = "pacote-inicial", porta = "9102/tcp (mgmt0)" },
  { nome = "snmpd",        versao = "5.9.4.pre2", porta = "161/udp (mgmt0)" },
  { nome = "tc netem",     versao = "iproute2 6.15.0", porta = "" },
